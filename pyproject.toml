[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyBatchMKVPropEdit"
dynamic = ["version"]  # single source: bmpe.__version__
description = "Batch editing of MKV properties with mkvpropedit"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6-Essentials>=6.7",
    "PySide6-Fluent-Widgets>=1.7",
    "pydantic>=2.6",
    "regex>=2024.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.gui-scripts]  # no console window next to the program on Windows
pybatchmkvpropedit = "bmpe.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "bmpe.__version__" }

[tool.setuptools.package-data]
bmpe = ["resources/*", "resources/licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
