# Builds the Windows exe and the Linux AppImage and attaches both to a GitHub release, each with a .sha256 file.
#
# Runs when a release is published. The release tag must match bmpe.__version__,
# e.g. tag "v0.2.0" for __version__ = "0.2.0".
# "Run workflow" (workflow_dispatch) builds the same files as downloadable run artifacts, without a release.
# Uses only the automatic GITHUB_TOKEN of the run; no secrets are needed.
#
# Everything the build uses is pinned: the actions by commit, the Python packages by version and hash
# (requirements-build.txt, see tools/lock_build_requirements.py) and appimagetool by version and hash.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # upload files to the release

env:
  PYTHON_VERSION: "3.14"
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # the build tools have no business with the token

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import bmpe; print(bmpe.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match version $version in src/bmpe/__init__.py"
            exit 1
          fi

      - name: Test
        run: python -m pytest -q

      - name: Build exe
        run: python -m PyInstaller build.spec --noconfirm

      - name: Rename and checksum
        id: asset
        shell: bash
        run: |
          asset="pyBatchMKVPropEdit-${{ steps.version.outputs.version }}-windows-x64.exe"
          mv dist/pyBatchMKVPropEdit.exe "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")
          echo "path=dist/$asset" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows
          path: |
            ${{ steps.asset.outputs.path }}
            ${{ steps.asset.outputs.path }}.sha256

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "${{ steps.asset.outputs.path }}" "${{ steps.asset.outputs.path }}.sha256"

  linux:
    # the AppImage runs on this glibc and newer ones, so build on an older Ubuntu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt

      - name: Read version
        id: version
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import bmpe; print(bmpe.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match version $version in src/bmpe/__init__.py"
            exit 1
          fi

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Get appimagetool
        run: |
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum --check --strict
          chmod +x appimagetool

      - name: Build AppImage
        env:
          PYTHON: python
          APPIMAGETOOL: ./appimagetool
        run: bash tools/build_appimage.sh

      - name: Rename and checksum
        id: asset
        run: |
          asset="pyBatchMKVPropEdit-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"
          mv "dist/pyBatchMKVPropEdit-${{ steps.version.outputs.version }}-x86_64.AppImage" "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")
          echo "path=dist/$asset" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: linux
          path: |
            ${{ steps.asset.outputs.path }}
            ${{ steps.asset.outputs.path }}.sha256

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "${{ steps.asset.outputs.path }}" "${{ steps.asset.outputs.path }}.sha256"
